name: alsafwa_school_app
description: تطبيق مدارس دار الصفوة الأهلية - ابتدائي وثانوي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
